<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jazz Overlay</title>
    <style>
      /* Overlay only. Keep painted content clipped to the BrowserWindow
         viewport; on Linux/X11, fractional scaling can otherwise report
         overflowing transparent pixels as a larger input surface. */
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
