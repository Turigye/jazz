<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Jazz — the app icon is the instrument. A brass-bezelled VU meter on a
       warm charcoal housing, lit from beneath by a tungsten lamp, needle
       riding just under 0 VU. Matches the meter in the overlay, which is the
       surface people actually look at all day. -->
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332e28"/>
      <stop offset="55%" stop-color="#241f1a"/>
      <stop offset="100%" stop-color="#16130f"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5c158"/>
      <stop offset="45%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#7d6318"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4e8c9"/>
      <stop offset="62%" stop-color="#e8d9b6"/>
      <stop offset="100%" stop-color="#cdbb92"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="96%" r="85%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffd9a0" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win">
      <rect x="42" y="66" width="172" height="104" rx="10"/>
    </clipPath>
  </defs>

  <!-- Housing -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#housing)"/>
  <!-- Lit top edge, the way a machined panel catches light -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none"
        stroke="#ffdcb4" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Brass bezel around the meter window -->
  <rect x="36" y="60" width="184" height="116" rx="14" fill="url(#bezel)"/>
  <rect x="42" y="66" width="172" height="104" rx="10" fill="url(#face)"/>
  <rect x="42" y="66" width="172" height="104" rx="10" fill="url(#lamp)"/>

  <g clip-path="url(#win)">
    <!-- Scale: black to 0 VU, oxide red beyond -->
    <path d="M64 150 A 78 78 0 0 1 168 92" fill="none" stroke="#3a3225"
          stroke-width="3.5" stroke-linecap="round"/>
    <path d="M168 92 A 78 78 0 0 1 196 128" fill="none" stroke="#c4442f"
          stroke-width="4.5" stroke-linecap="round"/>

    <!-- Ticks, bunched at the quiet end the way a real VU face is -->
    <g stroke="#3a3225" stroke-width="3" stroke-linecap="round">
      <line x1="66" y1="146" x2="72" y2="138"/>
      <line x1="82" y1="126" x2="88" y2="120"/>
      <line x1="104" y1="110" x2="107" y2="102"/>
      <line x1="128" y1="101" x2="129" y2="93"/>
    </g>
    <g stroke="#c4442f" stroke-width="3" stroke-linecap="round">
      <line x1="172" y1="98" x2="167" y2="105"/>
      <line x1="188" y1="116" x2="181" y2="120"/>
    </g>

    <!-- Needle, riding just under 0 VU. The hub is placed so it crests the
         bottom of the window as a shallow dome — the movement's cap sitting
         behind the bezel. No "VU" lettering: at 32px it is illegible noise,
         and the bezel-arc-needle silhouette is what makes this readable. -->
    <line x1="128" y1="188" x2="150" y2="96" stroke="#2b2213"
          stroke-width="5" stroke-linecap="round"/>
    <circle cx="128" cy="188" r="24" fill="url(#bezel)"/>
    <circle cx="128" cy="188" r="10" fill="#2a2214"/>
  </g>

  <!-- Indicator lamp on the housing, below the meter -->
  <circle cx="128" cy="206" r="7" fill="#c9a227"/>
  <circle cx="128" cy="206" r="12" fill="#c9a227" fill-opacity="0.22"/>
</svg>
