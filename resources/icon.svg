<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d872f8"/>
      <stop offset="55%" stop-color="#c44af0"/>
      <stop offset="100%" stop-color="#8e1db0"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3d0fe"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- microphone capsule -->
  <rect x="104" y="56" width="48" height="86" rx="24" fill="url(#mic)"/>
  <!-- mic stand arc -->
  <path d="M80 122 a48 48 0 0 0 96 0" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <rect x="122" y="170" width="12" height="26" rx="6" fill="#ffffff"/>
  <rect x="100" y="194" width="56" height="12" rx="6" fill="#ffffff"/>

  <!-- music note accent -->
  <g fill="#420350">
    <circle cx="150" cy="96" r="11"/>
    <rect x="159" y="60" width="7" height="40" rx="3"/>
    <path d="M159 60 q18 4 18 20 q-8 -12 -18 -8 z"/>
  </g>
</svg>
